# /etc/nginx/sites-available/vibra.recargo.pe
# Proxy inverso a la app FastAPI (uvicorn en 127.0.0.1:8000).
# El bloque SSL (443) lo agrega certbot automáticamente al correr:
#   certbot --nginx -d vibra.recargo.pe

server {
    listen 80;
    listen [::]:80;
    server_name vibra.recargo.pe;

    # Tamaño de request pequeño (esta app no sube archivos).
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Sirve estáticos con caché (el CSS/JS cambian solo al redeploy).
    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public";
    }
}
