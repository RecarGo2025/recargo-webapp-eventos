{% extends "base.html" %}
{% from "icons.html" import icon %}
{% block title %}Consulta tu alquiler — RecarGo{% endblock %}
{% block body %}
<main class="mx-auto flex min-h-screen max-w-sm flex-col justify-center px-6 py-10">

  <!-- ── Zona de marca ─────────────────────────────────────── -->
  <h1 class="title-sticker text-center font-display text-2xl sm:text-3xl">Estaciones de carga</h1>

  <!-- Lockup co-marca: Vibra (principal) · × · RecarGo (secundario) -->
  <div class="mt-6 flex flex-col items-center gap-2">
    <img src="/static/img/vibra.png?v={{ asset_v }}" alt="Vibra Perú" class="w-[48%] max-w-[176px]">
    <span class="flex h-7 w-7 items-center justify-center rounded-full border-2 border-ink bg-paper font-display text-sm text-ink shadow-sticker-sm">×</span>
    <img src="/static/img/recargo.svg?v={{ asset_v }}" alt="RecarGo" class="w-[42%] max-w-[152px]">
  </div>

  <!-- ── Zona de acción (tarjeta) ──────────────────────────── -->
  <div class="sticker mt-9 p-5">
    <h2 class="text-center font-display text-lg text-ink">Consulta tu alquiler</h2>

    {% if error %}
    <div class="toast toast-err mt-4">{{ icon('warning') }}<span>{{ error }}</span></div>
    {% endif %}

    <form method="post" action="/buscar" class="mt-4 space-y-3">
      <label class="block">
        <span class="mb-1.5 block text-sm font-extrabold text-ink">Tu documento</span>
        <input name="dni" inputmode="text" autocomplete="off" autofocus
               value="{{ dni or '' }}"
               placeholder="DNI, pasaporte o carné"
               class="field-input tracking-wide">
      </label>
      <button type="submit" class="btn btn-coral btn-lg w-full">
        Continuar {{ icon('arrow') }}
      </button>
    </form>
  </div>
</main>
{% endblock %}
